version: 2
updates:
  # 1. Rust Workspace Crates (Cargo)
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/rebuild"
      - "/rebuild/clients/smoke"
    schedule:
      interval: "daily"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(cargo)"

  # The Tauri GUI's npm tree moved out of the workspace to `_reference/` and is
  # being rebuilt as a separate client repo, so there is no npm ecosystem to
  # update here. Re-add an npm entry in the client repo, not this one.

  # 2. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "actions"
    commit-message:
      prefix: "deps(actions)"
