          retention-days: 7
  rebuild-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify test isolation preserves runner connectivity
        if: runner.os == 'Linux'
        run: python3 tests/egress/control_plane.py test-results/egress-controller scripts/egress.py
      - name: Prepare pinned toolchain and offline dependencies
        run: |
          rustup show active-toolchain
          python3 -m pip install ruff==0.16.7
          cargo fetch --locked
