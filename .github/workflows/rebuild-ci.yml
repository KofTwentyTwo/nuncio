      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify test isolation preserves runner connectivity
        if: runner.os == 'Linux'
        run: python3 tests/egress/control_plane.py test-results/egress-controller scripts/egress.py
      - name: Prepare pinned toolchain and offline dependencies
        run: |
          rustup show active-toolchain
          python3 -m pip install ruff==0.16.7
          cargo fetch --locked
          cargo fetch --locked --manifest-path clients/smoke/Cargo.toml
      - name: Run required offline checks with egress denied
        run: python3 scripts/egress.py --evidence test-results/rebuild-mock-contract-egress.json -- python3 scripts/verify.py --job rebuild-mock-contract
      - name: Retain command logs and numeric evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rebuild-mock-contract-${{ matrix.os }}-evidence
