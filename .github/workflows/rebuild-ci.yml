name: Nuncio rebuild
on:
  push:
    branches: [feature/nuncio-google-first-rebuild, dev]
    paths: ["rebuild/**", ".github/workflows/rebuild-ci.yml"]
  pull_request:
    paths: ["rebuild/**", ".github/workflows/rebuild-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rebuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
    working-directory: rebuild
jobs:
  rebuild-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify test isolation preserves runner connectivity
        if: runner.os == 'Linux'
        run: python3 tests/egress/control_plane.py test-results/egress-controller scripts/egress.py
      - name: Prepare pinned toolchain and offline dependencies
        run: |
          rustup show active-toolchain
          python3 -m pip install ruff==0.16.7
          cargo fetch --locked
          cargo fetch --locked --manifest-path clients/smoke/Cargo.toml
      - name: Run required offline checks with egress denied
        run: python3 scripts/egress.py --evidence test-results/rebuild-lint-egress.json -- python3 scripts/verify.py --job rebuild-lint
      - name: Retain command logs and numeric evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rebuild-lint-${{ matrix.os }}-evidence
          path: |
            rebuild/test-results/rebuild-lint/*.log
            rebuild/test-results/rebuild-lint/results.json
            rebuild/test-results/*-egress.json
            rebuild/test-results/egress-controller/exit-*/*.json
          if-no-files-found: warn
          retention-days: 7
  rebuild-mock-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
