      - name: Run required offline checks with egress denied
        run: python3 scripts/egress.py --evidence test-results/rebuild-e2e-egress.json -- python3 scripts/verify.py --job rebuild-e2e
      - name: Retain command logs and numeric evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rebuild-e2e-${{ matrix.os }}-evidence
          path: |
