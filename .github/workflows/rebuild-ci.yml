      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Verify test isolation preserves runner connectivity
        if: runner.os == 'Linux'
        run: python3 tests/egress/control_plane.py test-results/egress-controller scripts/egress.py
      - name: Prepare pinned toolchain and offline dependencies
        run: |
          rustup show active-toolchain
