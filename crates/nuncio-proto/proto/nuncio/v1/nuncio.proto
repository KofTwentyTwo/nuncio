syntax = "proto3";

package nuncio.v1;

// ErrorReason is the stable, machine-readable taxonomy of failure conditions
// the daemon reports to clients. It is carried inside an `ErrorInfo` in a
// failed RPC's gRPC status-details trailer so a client can branch on a
// discriminant instead of string-matching human-readable (English) error
// text. Each reason maps to a fixed canonical gRPC status code (see the
// server-side helper that builds the `Status`), so the transport-level code
// and this application-level reason always agree.
//
// Values are append-only: never renumber or repurpose an existing value.
// New failure conditions get a new value; `ERROR_REASON_UNSPECIFIED` is the
// zero value and is treated as a generic internal error by clients that do
// not recognize a (newer) reason.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // A request was syntactically or semantically invalid (missing/blank
  // required field, out-of-range value, unparseable NSQL, etc.).
  ERROR_REASON_VALIDATION_FAILED = 1;
  // No account exists for the referenced id.
  ERROR_REASON_ACCOUNT_NOT_FOUND = 2;
  // No filter rule exists for the referenced id.
  ERROR_REASON_RULE_NOT_FOUND = 3;
  // No stored message exists for the referenced id.
  ERROR_REASON_MESSAGE_NOT_FOUND = 4;
  // No stored calendar event exists for the referenced id.
  ERROR_REASON_EVENT_NOT_FOUND = 5;
  // No stored contact exists for the referenced id.
  ERROR_REASON_CONTACT_NOT_FOUND = 6;
  // The resource being created already exists.
  ERROR_REASON_ALREADY_EXISTS = 7;
  // A precondition is unmet: the operation requires configuration that is
  // not present yet (e.g. no CalDAV/CardDAV account configured to sync).
  ERROR_REASON_NOT_CONFIGURED = 8;
  // A required backend (mail/calendar/contacts server) could not be reached.
  ERROR_REASON_BACKEND_UNREACHABLE = 9;
  // The call was not authenticated (missing/invalid bearer credentials).
  ERROR_REASON_AUTH_REQUIRED = 10;
  // The requested operation is not supported (no honest implementation).
  ERROR_REASON_UNSUPPORTED = 11;
  // An unexpected internal error the client cannot act on specifically.
  ERROR_REASON_INTERNAL = 12;
}

// ErrorInfo is the structured error payload the daemon attaches to a failed
// RPC's gRPC status-details (`grpc-status-details-bin`) trailer. It carries a
// stable `reason` discriminant, optional structured `metadata` (e.g. the id
// of the resource that was not found), and the same human-readable `message`
// that the enclosing `Status` carries. Clients decode this to branch on
// `reason` rather than parsing `message`.
message ErrorInfo {
  // Stable machine-readable failure discriminant.
  ErrorReason reason = 1;
  // Optional structured context (e.g. {"account_id": "acct-1"}). Keys are
  // stable identifiers; values are the concrete offending inputs.
  map<string, string> metadata = 2;
  // Human-readable message, identical to the enclosing `Status` message.
  string message = 3;
}

// System service exposes daemon-level introspection RPCs.
//
// This is the foundation of the versioned gRPC API (see
// docs/adr/0001-engine-first-grpc-architecture.md). Additional services and
// RPCs will be added under the `nuncio.v1` package incrementally; breaking
// changes will be introduced under a new `nuncio.v2` package rather than
// mutating this one.
//
// `Subscribe` is deliberately defined on THIS service (rather than a separate
// one) so that it is automatically covered by the same server-side bearer
// auth interceptor that guards `GetStatus`, instead of risking a second,
// un-intercepted service being mounted by mistake.
service System {
  // GetStatus reports basic daemon/engine health information.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Subscribe opens a live, server-streaming push feed of daemon domain
  // events (see `nuncio_core::CoreEvent`) for the lifetime of the call. The
  // stream ends when the client disconnects or the daemon's event bus is
  // shut down.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

// GetStatusRequest currently carries no parameters. Fields may be added
// here later (e.g. requested detail level).
message GetStatusRequest {}

// GetStatusResponse reports the current health and build identity of the
// running nunciod engine.
message GetStatusResponse {
  // Human-readable engine status (e.g. "ok", "degraded").
  string engine_status = 1;
  // The nunciod build/crate version serving this response.
  string version = 2;
}

// SubscribeRequest currently carries no parameters. Fields may be added
// here later (e.g. event-kind filtering).
message SubscribeRequest {}

// Event faithfully mirrors `nuncio_core::CoreEvent`: exactly one variant
// message is populated per event, carrying that variant's fields. New
// `CoreEvent` variants MUST be added here as a new oneof case (never by
// repurposing an existing field number) to keep the wire contract stable.
message Event {
  oneof kind {
    SyncStarted sync_started = 1;
    SyncCompleted sync_completed = 2;
    MessageFlagsChanged message_flags_changed = 3;
    FilterExecuted filter_executed = 4;
    BatchFilterProgress batch_filter_progress = 5;
    DatabaseRecovered database_recovered = 6;
    UpdateAvailable update_available = 7;
    EventError error = 8;
    ShuttingDown shutting_down = 9;
  }
}

// Mirrors `CoreEvent::SyncStarted`.
message SyncStarted {
  // Account ID if scoped to a specific account; absent when synchronizing
  // all accounts.
  optional string account_id = 1;
}

// Mirrors `CoreEvent::SyncCompleted`.
message SyncCompleted {
  // Account ID if scoped to a specific account; absent when synchronizing
  // all accounts.
  optional string account_id = 1;
}

// Mirrors `CoreEvent::MessageFlagsChanged`.
message MessageFlagsChanged {
  // Message identifier.
  string message_id = 1;
  // New read state.
  bool read = 2;
}

// Mirrors `CoreEvent::FilterExecuted`.
message FilterExecuted {
  // Filter rule identifier.
  string rule_id = 1;
  // Email message identifier.
  string message_id = 2;
  // Action description.
  string action_taken = 3;
}

// Mirrors `CoreEvent::BatchFilterProgress`.
message BatchFilterProgress {
  // Messages processed so far in the batch.
  uint64 processed = 1;
  // Total message count in batch.
  uint64 total = 2;
  // Total matching rule executions.
  uint64 matched = 3;
}

// Mirrors `CoreEvent::DatabaseRecovered`.
message DatabaseRecovered {
  // Forensic backup path.
  string backup_path = 1;
  // Number of filter rules salvaged from corrupted DB.
  uint64 salvaged_rules_count = 2;
  // Whether automated resync was triggered.
  bool resync_triggered = 3;
}

// Mirrors `CoreEvent::UpdateAvailable`.
message UpdateAvailable {
  // Latest available release version (e.g. "0.2.0").
  string version = 1;
  // Release notes / changelog.
  string release_notes = 2;
}

// Mirrors `CoreEvent::Error`. Named `EventError` (rather than `Error`) to
// avoid colliding with the `Error` trait/derive macro name that is
// ubiquitous in hand-written Rust using this generated module.
message EventError {
  // Error message text.
  string message = 1;
}

// Mirrors `CoreEvent::ShuttingDown`, which carries no fields.
message ShuttingDown {}

// Accounts manages persisted mail/calendar account configurations.
//
// SECURITY: this service MUST be mounted behind the SAME
// `BearerAuthInterceptor` that guards `System` -- every gRPC service `nunciod`
// exposes MUST be authenticated, with no exceptions carved out for "just one
// more" unauthenticated service. See `nunciod::grpc::serve_on_listener`.
service Accounts {
  // AddAccount persists a new account configuration to the daemon's
  // database and stores its password credential in the OS keyring vault.
  // The password is NEVER written to the database and NEVER echoed back.
  rpc AddAccount(AddAccountRequest) returns (AddAccountResponse);
  // ListAccounts returns every persisted account configuration. Password
  // credentials are NEVER included in this response.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  // UpdateAccount overwrites an existing account's persisted configuration.
  // The password is optional: when omitted the existing keyring credential
  // is left untouched; when present it REPLACES the stored credential in the
  // OS keyring vault (never written to SQLite, never echoed back). A password
  // rotation that cannot be persisted is rolled back so the vault never
  // diverges from the persisted account row.
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  // RemoveAccount deletes a persisted account configuration by id and its
  // associated keyring credential.
  rpc RemoveAccount(RemoveAccountRequest) returns (RemoveAccountResponse);
  // TestAccountConnection performs a real, bounded connection probe against
  // the account's configured IMAP and SMTP endpoints (honoring each one's
  // TLS transport mode) and reports the GENUINE per-protocol outcome -- never
  // a fabricated success. The two legs verify DIFFERENT depths, and callers
  // must not conflate them:
  //   - IMAP verifies a full LOGIN: connect, negotiate TLS/STARTTLS, and
  //     authenticate with the account's keyring credential.
  //   - SMTP verifies only TRANSPORT REACHABILITY: connect and negotiate
  //     TLS/STARTTLS. It does NOT perform an SMTP AUTH exchange, so `smtp_ok`
  //     does not assert the credential is valid for outbound mail (SMTP has
  //     no standard authentication probe that does not also submit a message).
  // A probe that fails carries the real error detail; each leg is bounded by
  // a timeout so the RPC cannot hang against an unreachable host.
  rpc TestAccountConnection(TestAccountConnectionRequest) returns (TestAccountConnectionResponse);
}

// Mirrors `nuncio_core::AccountProtocol`.
enum AccountProtocol {
  ACCOUNT_PROTOCOL_UNSPECIFIED = 0;
  ACCOUNT_PROTOCOL_JMAP = 1;
  ACCOUNT_PROTOCOL_IMAP_SMTP = 2;
  // CalDAV (RFC 4791) calendar-collection account. A CalDAV account is its
  // own first-class account entry: it carries `collection_url` and its own
  // keyring credential, and does not require the IMAP/SMTP mail endpoints.
  ACCOUNT_PROTOCOL_CALDAV = 3;
}

// Mirrors `nuncio_core::TlsMode`.
enum TlsMode {
  TLS_MODE_UNSPECIFIED = 0;
  TLS_MODE_IMPLICIT_TLS = 1;
  TLS_MODE_START_TLS = 2;
  TLS_MODE_PLAIN = 3;
}

// Mirrors `nuncio_core::AccountConfig` field-for-field, MINUS the password
// credential: this message is used both as the request payload (alongside
// a separate `password` field) and as the response payload of
// `ListAccounts`, and the password MUST NEVER appear in the latter.
message AccountConfig {
  // Unique identifier for the account configuration.
  string id = 1;
  // User-friendly display name (e.g. "Work Mail").
  string name = 2;
  // Primary email address associated with the account.
  string email_address = 3;
  // Protocol engine type.
  AccountProtocol protocol = 4;
  // Server hostname or IP address (IMAP/JMAP).
  string server_host = 5;
  // Server port number (1..=65535) (IMAP/JMAP).
  uint32 server_port = 6;
  // Whether TLS connection encryption is enabled.
  bool use_tls = 7;
  // IMAP connection security transport mode.
  TlsMode imap_tls_mode = 8;
  // SMTP connection security transport mode.
  TlsMode smtp_tls_mode = 9;
  // Keyring entry key used to retrieve OS vault credentials.
  string keyring_secret_key = 10;
  // Background sync polling interval in seconds (minimum 10s).
  uint64 sync_interval_secs = 11;
  // SMTP server hostname or IP address, used for outbound mail. Distinct
  // from `server_host` because a mail provider's inbound (IMAP/JMAP) and
  // outbound (SMTP) endpoints commonly differ.
  string smtp_host = 12;
  // SMTP server port number (1..=65535), used for outbound mail.
  uint32 smtp_port = 13;
  // Fully-qualified collection URL for DAV-protocol accounts (e.g. a CalDAV
  // calendar collection or, later, a CardDAV address-book collection). Set
  // for accounts whose protocol speaks WebDAV; empty for mail accounts. This
  // is a full URL (scheme + host + path), not a bare host, because a DAV
  // client dispatches requests directly at the collection URL.
  string collection_url = 14;
}

// AddAccountRequest carries the full account configuration plus the raw
// password credential. `password` is written ONLY to the OS keyring vault
// (under `config.keyring_secret_key`) by the daemon -- it is never persisted
// to SQLite, never logged, and never echoed back in `AddAccountResponse`.
message AddAccountRequest {
  AccountConfig config = 1;
  string password = 2;
}

// AddAccountResponse deliberately carries only the persisted account's id,
// never the password nor the full config (callers already have both).
message AddAccountResponse {
  string id = 1;
}

// ListAccountsRequest currently carries no parameters.
message ListAccountsRequest {}

// ListAccountsResponse. `accounts` MUST NEVER contain password credentials
// -- see `AccountConfig`'s doc comment.
message ListAccountsResponse {
  repeated AccountConfig accounts = 1;
}

// UpdateAccountRequest carries the full replacement account configuration
// plus an OPTIONAL password. When `password` is absent the account's existing
// keyring credential is preserved; when present it is written to the OS
// keyring vault (under `config.keyring_secret_key`), exactly like
// `AddAccountRequest` -- never persisted to SQLite, never logged, never
// echoed back.
message UpdateAccountRequest {
  AccountConfig config = 1;
  optional string password = 2;
}

// UpdateAccountResponse deliberately carries no fields: a successful RPC
// response (as opposed to a `Status` error) is confirmation enough, and the
// caller already holds the updated config it just sent.
message UpdateAccountResponse {}

// RemoveAccountRequest names the account configuration to delete by id.
message RemoveAccountRequest {
  string id = 1;
}

// RemoveAccountResponse currently carries no fields; a successful RPC
// response is confirmation enough.
message RemoveAccountResponse {}

// TestAccountConnectionRequest names the persisted account to probe by id.
message TestAccountConnectionRequest {
  string id = 1;
}

// TestAccountConnectionResponse reports the REAL, independent outcome of
// probing each protocol endpoint -- never a fabricated success. `imap_error`
// / `smtp_error` are present only when the corresponding `*_ok` is false and
// carry the genuine failure detail (dial/handshake/auth error text). The two
// `*_ok` flags verify different depths -- see `TestAccountConnection`.
message TestAccountConnectionResponse {
  // Whether the IMAP endpoint FULLY authenticated: connect, TLS/STARTTLS
  // negotiation, AND login with the account's credential all succeeded.
  bool imap_ok = 1;
  // Whether the SMTP endpoint was REACHABLE: connect and TLS/STARTTLS
  // negotiation succeeded. This is a transport-reachability check only -- it
  // does NOT perform an SMTP AUTH exchange, so it does not assert the
  // credential is valid for outbound mail.
  bool smtp_ok = 2;
  // Present only when `imap_ok` is false: the real IMAP login/handshake error.
  optional string imap_error = 3;
  // Present only when `smtp_ok` is false: the real SMTP transport/handshake
  // error.
  optional string smtp_error = 4;
}

// Mail exposes the READ path over the daemon's real, persistent message
// store (the data that syncs in via `DatabaseEngine::save_email`).
//
// SECURITY: this service MUST be mounted behind the SAME
// `BearerAuthInterceptor` that guards `System` and `Accounts` -- every gRPC
// service `nunciod` exposes MUST be authenticated, with no exceptions
// carved out for "just one more" unauthenticated service. See
// `nunciod::grpc::serve_on_listener`.
service Mail {
  // ListFolders returns every mailbox folder known to the store, with
  // total/unread message counts.
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse);
  // ListMessages returns messages in a single folder, newest first, capped
  // at `limit`.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  // GetMessage returns a single message by ID, including its (decrypted)
  // body.
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  // MarkRead updates a message's read/unread flag.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  // SearchMessages runs a full-text (FTS5) search over cached message
  // subjects, senders, and bodies.
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  // SendMessage composes and sends a real outbound email over SMTP, built
  // from the configured account's SMTP endpoint
  // (`AccountConfig.smtp_host`/`smtp_port`) and its keyring-stored
  // password. When `account_id` is set, that specific account is used as
  // the sender, and a request naming an account that does not exist fails
  // rather than silently falling back to a different account. When
  // `account_id` is omitted, the first configured account is used. Returns
  // successfully ONLY when
  // the SMTP transport genuinely accepted the message for delivery --
  // never a fabricated success. A transport/authentication failure surfaces
  // as a `Status::internal` (or `Status::invalid_argument` for a malformed
  // request) error, never a fabricated `SendMessageResponse`.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // Sync triggers a real inbound mail synchronization: fetches folders and
  // messages from the account's real mail backend and persists them via
  // the store, exactly as `nunciod`'s internal sync command loop does,
  // EXCEPT this awaits full completion before returning -- a successful
  // response guarantees the synced messages are already visible to
  // `ListMessages`/`GetMessage`. This is the authenticated, over-the-wire
  // replacement for reaching into daemon internals to trigger a sync.
  rpc Sync(SyncRequest) returns (SyncResponse);
}

// Mirrors `nuncio_core::model::Attachment`.
message Attachment {
  // Attachment filename.
  string filename = 1;
  // MIME content type (e.g. "application/pdf").
  string mime_type = 2;
  // Raw attachment content buffer.
  bytes content = 3;
}

// Mirrors `nuncio_core::model::Email` field-for-field. Named `Message`
// (rather than `Email`) to avoid colliding with common generated-code
// identifiers in hand-written Rust using this module.
message Message {
  // Unique message identifier.
  string id = 1;
  // Account identifier owning the message.
  string account_id = 2;
  // Mailbox folder identifier (e.g. "inbox").
  string folder_id = 3;
  // Subject line.
  string subject = 4;
  // Sender address.
  string sender = 5;
  // Recipient address.
  string recipient = 6;
  // Unix timestamp of message arrival.
  int64 received_at = 7;
  // Read/unread flag status.
  bool read = 8;
  // Plaintext message body (already decrypted by the store).
  optional string body_plain = 9;
  // HTML message body (already decrypted by the store).
  optional string body_html = 10;
  // List of attached files.
  repeated Attachment attachments = 11;
}

// Mirrors `nuncio_core::model::Folder`.
message Folder {
  // Folder identifier.
  string id = 1;
  // Folder display name.
  string name = 2;
  // Total message count.
  uint64 total_messages = 3;
  // Unread message count.
  uint64 unread_messages = 4;
}

// ListFoldersRequest currently carries no parameters.
message ListFoldersRequest {}

// ListFoldersResponse.
message ListFoldersResponse {
  repeated Folder folders = 1;
}

// ListMessagesRequest. `limit` caps the number of messages returned
// (newest first); a value of 0 means "use the server's default limit".
message ListMessagesRequest {
  // Mailbox folder identifier (e.g. "inbox").
  string folder_id = 1;
  // Maximum number of messages to return; 0 means "server default".
  uint32 limit = 2;
}

// ListMessagesResponse.
message ListMessagesResponse {
  repeated Message messages = 1;
}

// GetMessageRequest.
message GetMessageRequest {
  // Unique message identifier.
  string message_id = 1;
}

// GetMessageResponse.
message GetMessageResponse {
  Message message = 1;
}

// MarkReadRequest.
message MarkReadRequest {
  // Unique message identifier.
  string message_id = 1;
  // Desired read state.
  bool read = 2;
}

// MarkReadResponse currently carries no parameters; a successful RPC
// response (as opposed to a `Status` error) is confirmation enough.
message MarkReadResponse {}

// SearchMessagesRequest.
message SearchMessagesRequest {
  // Full-text search query string.
  string query = 1;
}

// Mirrors `nuncio_store::search::SearchHit`.
message MessageSearchHit {
  // Matching message ID.
  string id = 1;
  // Matching subject/title.
  string title = 2;
  // Text snippet matching the search term.
  string snippet = 3;
}

// SearchMessagesResponse.
message SearchMessagesResponse {
  repeated MessageSearchHit hits = 1;
}

// SendMessageRequest carries a composed outbound email. The sending
// account's own address is used as the `From:` header -- it is resolved
// server-side from the configured account, never supplied by the caller.
message SendMessageRequest {
  // Recipient email address.
  string to = 1;
  // Optional CC recipient email address.
  optional string cc = 2;
  // Message subject line.
  string subject = 3;
  // Plaintext message body.
  string body_text = 4;
  // Optional HTML message body.
  optional string body_html = 5;
  // Optional file attachments.
  repeated Attachment attachments = 6;
  // Optional identifier of the account to send from. When omitted, the
  // first configured account is used (preserving prior behavior); when
  // set, the named account must exist or the request fails.
  optional string account_id = 7;
}

// SendMessageResponse. A successful response means the SMTP transport
// genuinely accepted the message for delivery -- never a fabricated
// success (see `Mail.SendMessage`'s doc comment).
message SendMessageResponse {
  // Daemon-generated identifier for the sent message, for reference in
  // logs/output. NOT a persisted message id -- outbound sends are not
  // written back into the synced message store by this RPC.
  string message_id = 1;
}

// SyncRequest. `account_id` mirrors `CoreCommand::SyncAccount`/`SyncAll`:
// absent/empty means synchronize every configured account; set means
// synchronize just that one account.
message SyncRequest {
  optional string account_id = 1;
}

// SyncResponse reports how many messages were synchronized.
message SyncResponse {
  uint64 synced_count = 1;
}

// Filters exposes the NSQL filter engine's rule CRUD, validation, and
// dry-run preview operations over gRPC -- the authenticated replacement
// for the existing hand-rolled `filter.*` JSON-RPC IPC methods
// (`nunciod::main`'s `CustomRpcHandler`), which remain in place (both
// transports coexist) until they are retired.
//
// This faithfully exposes the filter engine as it exists today, including
// its known correctness gaps (e.g. `target_account`/`ON ACCOUNT` matching
// against `folder_id` rather than the message's actual account field) --
// fixing those is out of scope here.
//
// SECURITY: this service MUST be mounted behind the SAME
// `BearerAuthInterceptor` that guards `System`/`Accounts`/`Mail` -- every
// gRPC service `nunciod` exposes MUST be authenticated, with no exceptions
// carved out for "just one more" unauthenticated service. See
// `nunciod::grpc::serve_on_listener`.
service Filters {
  // CreateRule parses and validates an NSQL rule definition, then persists
  // it and reloads the daemon's live `FilterEngine` rule set (via its
  // `ArcSwap`-backed hot-reload) so the new rule is active immediately.
  // Rejects a syntactically or semantically invalid rule with
  // `Status::invalid_argument` -- nothing is ever persisted on failure.
  rpc CreateRule(CreateRuleRequest) returns (CreateRuleResponse);
  // ListRules returns every persisted filter rule, priority ascending.
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  // DeleteRule removes a persisted filter rule by ID and reloads the
  // daemon's live `FilterEngine` rule set so the removal takes effect
  // immediately.
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
  // ValidateRule parses and runs the 6-pass `NsqlValidator` audit against
  // an NSQL rule definition WITHOUT persisting it. Unlike `CreateRule`,
  // an invalid rule is NOT an RPC failure: it is the expected, honestly
  // reported result carried in `ValidateRuleResponse.valid`/`error`.
  rpc ValidateRule(ValidateRuleRequest) returns (ValidateRuleResponse);
  // PreviewRule dry-run evaluates an ad hoc, NOT-yet-persisted NSQL rule
  // definition against a stored message (by `message_id`) -- or, if none is
  // given, a synthetic sample message -- using `FilterEngine::preview`'s
  // existing dry-run evaluation path. Never persists the rule and never
  // executes any of its actions.
  rpc PreviewRule(PreviewRuleRequest) returns (PreviewRuleResponse);
  // UpdateRule applies partial overrides (name/nsql/priority) to an existing
  // persisted rule, re-validates the resulting rule exactly as `CreateRule`
  // does, and reloads the daemon's live `FilterEngine` rule set so the
  // change takes effect immediately. Rejects an unknown `id` with
  // `Status::not_found` and an invalid resulting rule with
  // `Status::invalid_argument` -- nothing is persisted on either failure.
  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleResponse);
  // ExportRules renders every persisted filter rule in the requested
  // `format` ("sql" or "json") and returns the rendered text inline --
  // small enough, unlike a mailbox export, to carry directly over the RPC
  // rather than writing to a shared filesystem path.
  rpc ExportRules(ExportRulesRequest) returns (ExportRulesResponse);
  // ImportRules parses each non-empty, non-comment line of `content` as an
  // independent NSQL rule definition and persists the ones that parse.
  // Reports both the count of rules actually persisted and the parse error
  // for every line that failed, rather than silently dropping failures.
  rpc ImportRules(ImportRulesRequest) returns (ImportRulesResponse);
  // GetExecutionLogs returns the most recent persisted filter execution
  // log entries (hash-chain ledger), newest-eligible-first as stored,
  // capped at `limit`.
  rpc GetExecutionLogs(GetExecutionLogsRequest) returns (GetExecutionLogsResponse);
  // Triage scans every stored message in bounded chunks, evaluating the
  // daemon's live `FilterEngine` against each one and applying the same
  // actions live sync would -- so the currently active rule set can be
  // applied retroactively to mail that was synced before those rules
  // existed. Streams cumulative progress as it works, ending with a final
  // `done: true` message once the whole store has been scanned.
  rpc Triage(TriageRequest) returns (stream TriageProgress);
}

// FilterRule mirrors `nuncio_filter::FilterRule`'s persisted/user-facing
// fields. The parsed condition AST is intentionally NOT mirrored here --
// `nsql_text` is the single source of truth, and re-parsing it via
// `NsqlParser::parse_rule` deterministically reconstructs the identical AST,
// so there is no independent state to carry over the wire. `actions` is the
// NSQL-rendered form (`RuleAction::to_nsql`) of the rule's parsed action
// list, included for display purposes.
message FilterRule {
  // Rule unique identifier.
  string id = 1;
  // Rule display name.
  string name = 2;
  // Target account pattern ("*" for all accounts, an exact address, or a
  // wildcard like "%@kof22.com").
  string target_account = 3;
  // Rule evaluation order (0 = highest).
  int32 priority = 4;
  // Active flag.
  bool enabled = 5;
  // Full NSQL source code text.
  string nsql_text = 6;
  // Rendered NSQL action clauses (e.g. "MOVE TO 'Archive'"), derived from
  // the parsed AST.
  repeated string actions = 7;
  // Creation timestamp (unix seconds).
  int64 created_at = 8;
  // Last update timestamp (unix seconds).
  int64 updated_at = 9;
}

// CreateRuleRequest carries a new rule's display name, full NSQL source
// text, and evaluation priority.
message CreateRuleRequest {
  // Display name for the rule.
  string name = 1;
  // Full NSQL source code text (may include an `ON ACCOUNT` clause and
  // `ACTION` clause).
  string nsql = 2;
  // Evaluation order (0 = highest).
  int32 priority = 3;
}

// CreateRuleResponse carries the persisted rule, including its
// daemon-assigned `id` and timestamps.
message CreateRuleResponse {
  FilterRule rule = 1;
}

// ListRulesRequest currently carries no parameters.
message ListRulesRequest {}

// ListRulesResponse.
message ListRulesResponse {
  repeated FilterRule rules = 1;
}

// DeleteRuleRequest.
message DeleteRuleRequest {
  // Rule unique identifier.
  string id = 1;
}

// DeleteRuleResponse currently carries no parameters; a successful RPC
// response (as opposed to a `Status` error) is confirmation enough.
message DeleteRuleResponse {}

// ValidateRuleRequest carries only the raw NSQL source text -- validation
// never persists anything, so no name/priority/id is needed.
message ValidateRuleRequest {
  string nsql = 1;
}

// ValidateRuleResponse. `valid == false` is an ordinary, successfully
// returned result (never a `Status` error) carrying the honest parse or
// `NsqlValidator` failure message in `error`.
message ValidateRuleResponse {
  // Whether `nsql` parsed AND passed every `NsqlValidator` pass.
  bool valid = 1;
  // Empty when `valid` is true; otherwise the parse or validation error
  // message.
  string error = 2;
}

// PreviewRuleRequest carries an ad hoc, NOT-yet-persisted NSQL rule
// definition to dry-run evaluate. `message_id` optionally names a stored
// message to evaluate against (looked up via the same store `Mail/
// GetMessage` reads); when absent (or when `message_id` does not resolve to
// a stored message), a fixed synthetic sample message is evaluated instead,
// so this RPC can always return a result.
message PreviewRuleRequest {
  // Full NSQL source code text of the rule to preview.
  string nsql = 1;
  // Optional stored message id to evaluate the rule against.
  optional string message_id = 2;
}

// PreviewRuleResponse mirrors `nuncio_filter::FilterPreviewResult`
// field-for-field, except `actions_evaluated` is rendered as NSQL strings
// (`RuleAction::to_nsql`) rather than a structured action AST.
message PreviewRuleResponse {
  // Evaluated message id (either the requested `message_id`, or the
  // synthetic sample message's fixed id when none was given/resolvable).
  string message_id = 1;
  // Whether the previewed rule matched the evaluated message.
  bool matched = 2;
  // Present only when `matched` is true.
  optional string matched_rule_id = 3;
  // Present only when `matched` is true.
  optional string matched_rule_name = 4;
  // NSQL-rendered actions that would be executed on a real match.
  repeated string actions_evaluated = 5;
  // Evaluation duration in microseconds.
  uint64 execution_time_us = 6;
  // Human-readable step-by-step match traces.
  repeated string condition_traces = 7;
}

// UpdateRuleRequest carries a persisted rule's `id` plus optional
// per-field overrides; an absent field leaves that field unchanged on the
// existing rule.
message UpdateRuleRequest {
  // Rule unique identifier.
  string id = 1;
  // New display name, if changing.
  optional string name = 2;
  // New full NSQL source code text, if changing.
  optional string nsql = 3;
  // New evaluation order, if changing.
  optional int32 priority = 4;
}

// UpdateRuleResponse carries the rule as persisted after applying the
// requested overrides.
message UpdateRuleResponse {
  FilterRule rule = 1;
}

// ExportRulesRequest names the rendering format for `ExportRules`.
message ExportRulesRequest {
  // "sql" or "json".
  string format = 1;
}

// ExportRulesResponse carries every persisted rule pre-rendered as a single
// text blob in the requested format.
message ExportRulesResponse {
  string content = 1;
}

// ImportRulesRequest carries raw rule-definition text to parse and persist,
// one NSQL rule definition per non-empty, non-comment (`--`-prefixed) line.
message ImportRulesRequest {
  string content = 1;
}

// ImportRulesResponse reports how many lines parsed and persisted
// successfully, and the parse error for every line that did not.
message ImportRulesResponse {
  // Count of rule definitions successfully parsed and persisted.
  int32 imported_count = 1;
  // Parse error message for each line that failed, in encounter order.
  repeated string errors = 2;
}

// GetExecutionLogsRequest caps the number of log entries returned.
message GetExecutionLogsRequest {
  uint32 limit = 1;
}

// GetExecutionLogsResponse.
message GetExecutionLogsResponse {
  repeated FilterExecutionLog logs = 1;
}

// FilterExecutionLog mirrors `nuncio_filter::FilterExecutionLog`
// field-for-field -- the hash-chain ledger entry recorded each time a
// persisted rule matches and acts on a message.
message FilterExecutionLog {
  // Log entry primary key.
  int64 id = 1;
  // Rule ID executed.
  string rule_id = 2;
  // Email message ID evaluated.
  string message_id = 3;
  // Action description string.
  string action_taken = 4;
  // Timestamp of execution (unix seconds).
  int64 matched_at = 5;
  // Hash of the preceding log record in the hash-chain ledger.
  string prev_hash = 6;
  // HMAC-SHA256 hash of this record.
  string hash = 7;
}

// TriageRequest configures a retroactive rescan of the whole message store.
message TriageRequest {
  // Scope the scan to a single rule's actions. Currently NOT honored --
  // `Triage` always evaluates a message against the full live rule set,
  // matching what a real (non-retroactive) sync run would do. Reserved for
  // forward compatibility; a client that sets this today gets a whole-store
  // scan against all active rules, not an error.
  optional string rule_id = 1;
  // Number of messages fetched per keyset page. 0 selects the server
  // default (100).
  uint32 chunk_size = 2;
}

// TriageProgress reports the real, cumulative state of an in-progress (or
// just-finished) `Triage` scan. Every field is the true running total as of
// the chunk just processed -- never an estimate or a fabricated count.
message TriageProgress {
  // Total messages scanned so far.
  uint64 scanned_count = 1;
  // Total messages that had at least one action applied or enqueued.
  uint64 matched_count = 2;
  // Total individual actions applied or enqueued across all messages.
  uint64 actions_applied_count = 3;
  // ID of the last message scanned in the most recently processed chunk.
  string last_message_id = 4;
  // True only on the final message of the stream, once the whole store has
  // been scanned.
  bool done = 5;
}

// Export exposes the daemon's real mailbox export engine
// (`nuncio_core::export`, via `DatabaseEngine::export_messages_to_file`)
// over authenticated gRPC. The daemon and its caller run on the SAME host
// (a local, single-machine deployment), so writing the export to a
// filesystem path on that shared host -- rather than streaming potentially
// very large export bytes back over the RPC itself -- is both simpler and
// honest about where the data actually ends up.
//
// SECURITY: this service MUST be mounted behind the SAME
// `BearerAuthInterceptor` that guards `System`/`Accounts`/`Mail`/`Filters`
// -- every gRPC service `nunciod` exposes MUST be authenticated, with no
// exceptions carved out for "just one more" unauthenticated service. See
// `nunciod::grpc::serve_on_listener`.
service Export {
  // ExportMailbox writes every message in `scope` to `output_path` in
  // `format`, using the real `nuncio_core::export::ExportEngine`. Returns
  // real message/byte counts read back from the file actually written --
  // never fabricated. Also appends a WORM audit record for the export (see
  // `Audit`).
  rpc ExportMailbox(ExportRequest) returns (ExportResponse);
}

// Mirrors `nuncio_core::export::ExportFormat`.
enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  // RFC 4155 MBOX format (.mbox).
  EXPORT_FORMAT_MBOX = 1;
  // Zip archive of individual .eml MIME files (.zip).
  EXPORT_FORMAT_EML_ZIP = 2;
  // Structured JSON array (.json).
  EXPORT_FORMAT_JSON = 3;
  // JSON Lines, one message per line (.jsonl).
  EXPORT_FORMAT_JSONL = 4;
}

// ExportRequest. `scope` selects which messages to export -- absent (no
// oneof case set) means every message across every account and folder;
// setting `account_id` or `folder_id` narrows the export to just that
// account's or that folder's messages. These are the only scopes the store
// can currently filter export by -- there is deliberately no broader query
// scope here (e.g. an arbitrary NSQL filter) since the underlying store has
// no such filtered read path to back one honestly.
message ExportRequest {
  oneof scope {
    // Restrict the export to a single account's messages.
    string account_id = 1;
    // Restrict the export to a single folder's messages.
    string folder_id = 2;
  }
  // Export output format.
  ExportFormat format = 3;
  // Absolute filesystem path to write the export to, on the SAME host the
  // `nunciod` daemon runs on (see `Export`'s doc comment).
  string output_path = 4;
}

// ExportResponse reports the REAL result of writing `output_path` -- never
// a fabricated count.
message ExportResponse {
  // The path written to (echoes `ExportRequest.output_path`).
  string output_path = 1;
  // Number of messages actually written.
  uint64 message_count = 2;
  // Total bytes actually written to `output_path`.
  uint64 bytes_written = 3;
}

// Calendar exposes the READ path over the daemon's real, persistent calendar
// event store (`DatabaseEngine::save_calendar_event`/`list_calendar_events`/
// `get_calendar_event`), plus a real `Sync` that fetches events from a
// `CalendarBackend` and persists them.
//
// This is an honest surface: there is currently no way to persist a
// per-account CalDAV collection URL/credential, so `Sync` in production (no
// injected test backend) has no real CalDAV connection to make and returns
// an error rather than a fabricated success. There are deliberately no
// create/delete RPCs here -- this service does not add real CalDAV write
// support.
//
// SECURITY: this service MUST be mounted behind the SAME
// `BearerAuthInterceptor` that guards every other service `nunciod` exposes
// -- no exceptions carved out for "just one more" unauthenticated service.
// See `nunciod::grpc::serve_on_listener`.
service Calendar {
  // Sync fetches events for `calendar_id` within `[start_window, end_window]`
  // from the account's calendar backend and persists them via the store.
  // With no per-account CalDAV configuration available in production, this
  // returns `Status::internal` describing that gap unless a test double has
  // been injected -- never a fabricated `synced_count`.
  rpc Sync(CalendarSyncRequest) returns (CalendarSyncResponse);
  // ListEvents returns persisted events for `account_id` whose window
  // overlaps `[start_window, end_window]`, ordered by start time -- always
  // genuinely persisted data, never fabricated.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // GetEvent returns a single persisted event by ID.
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
}

// Mirrors `nuncio_core::model::CalendarEvent` field-for-field. Named
// `CalendarEvent` (matching the core model) rather than `Event` -- `Event` is
// already taken by `System`'s push-event wrapper.
message CalendarEvent {
  // Event identifier.
  string id = 1;
  // Account identifier owning the event.
  string account_id = 2;
  // Calendar collection identifier.
  string calendar_id = 3;
  // Event title or summary.
  string summary = 4;
  // Unix timestamp for event start.
  int64 start_time = 5;
  // Unix timestamp for event end.
  int64 end_time = 6;
  // Recurrence rule string (RFC 5545 RRULE format).
  optional string rrule = 7;
  // Location text.
  optional string location = 8;
}

// CalendarSyncRequest carries the calendar collection and time window to
// sync, since `CalendarBackend::fetch_events` is inherently scoped that way
// (unlike `Mail`'s account-wide `Sync`).
message CalendarSyncRequest {
  string account_id = 1;
  string calendar_id = 2;
  int64 start_window = 3;
  int64 end_window = 4;
}

// CalendarSyncResponse reports how many events were synchronized.
message CalendarSyncResponse {
  uint64 synced_count = 1;
}

// ListEventsRequest.
message ListEventsRequest {
  string account_id = 1;
  string calendar_id = 2;
  int64 start_window = 3;
  int64 end_window = 4;
}

// ListEventsResponse.
message ListEventsResponse {
  repeated CalendarEvent events = 1;
}

// GetEventRequest.
message GetEventRequest {
  string event_id = 1;
}

// GetEventResponse.
message GetEventResponse {
  CalendarEvent event = 1;
}

// Contacts exposes the READ path over the daemon's real, persistent contact
// store (`DatabaseEngine::save_contact`/`list_contacts`/`get_contact`), plus
// a real `Sync` that fetches contacts from a `ContactsBackend` and persists
// them, and a `CreateContact` that persists a locally-authored contact
// directly to that same store.
//
// This is an honest surface: there is currently no way to persist a
// per-account CardDAV address book collection URL/credential, so `Sync` in
// production (no injected test backend) has no real CardDAV connection to
// make and returns an error rather than a fabricated success.
// `CreateContact` is NOT a CardDAV write-back -- it only ever writes to the
// daemon's own local store, the same way the address book has always worked
// here, just now actually persisted through the daemon's real store instead
// of a disposable per-process in-memory database. There is deliberately no
// RPC to delete a contact or to push a locally-authored contact back to a
// remote CardDAV server.
//
// SECURITY: this service MUST be mounted behind the SAME
// `BearerAuthInterceptor` that guards every other service `nunciod` exposes
// -- no exceptions carved out for "just one more" unauthenticated service.
// See `nunciod::grpc::serve_on_listener`.
service Contacts {
  // Sync fetches contacts for `account_id` from the account's contacts
  // backend and persists them via the store. With no per-account CardDAV
  // configuration available in production, this returns `Status::internal`
  // describing that gap unless a test double has been injected -- never a
  // fabricated `synced_count`.
  rpc Sync(ContactsSyncRequest) returns (ContactsSyncResponse);
  // ListContacts returns persisted contacts for `account_id`, ordered by
  // interaction count then display name -- always genuinely persisted data,
  // never fabricated.
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  // GetContact returns a single persisted contact by ID.
  rpc GetContact(GetContactRequest) returns (GetContactResponse);
  // CreateContact persists a new, locally-authored contact directly to the
  // daemon's store. This is real local persistence, not a fabricated CardDAV
  // write-back -- the created contact is never pushed to a remote server.
  rpc CreateContact(CreateContactRequest) returns (CreateContactResponse);
}

// Mirrors `nuncio_contacts::models::ContactEmail`.
message ContactEmail {
  // Email address.
  string email = 1;
  // Address label (e.g. "work", "home", "other").
  string label = 2;
  // Whether this is the contact's primary email address.
  bool is_primary = 3;
}

// Mirrors `nuncio_contacts::models::ContactPhone`.
message ContactPhone {
  // Phone number.
  string phone = 1;
  // Number label (e.g. "mobile", "work", "home").
  string label = 2;
  // Whether this is the contact's primary phone number.
  bool is_primary = 3;
}

// Mirrors `nuncio_contacts::models::Contact` field-for-field, except the
// internal bookkeeping timestamps (`created_at`/`updated_at`/
// `last_interacted_at`) are deliberately omitted -- no real client use case
// for them was identified for this vertical; they can be added additively
// later if one arises.
message Contact {
  // Contact unique identifier.
  string id = 1;
  // Account identifier owning this contact's address book entry.
  optional string account_id = 2;
  // Display name.
  string display_name = 3;
  // Given (first) name.
  optional string given_name = 4;
  // Family (last) name.
  optional string family_name = 5;
  // Organization / company name.
  optional string organization = 6;
  // Job title.
  optional string job_title = 7;
  // Free-form notes.
  optional string notes = 8;
  // Avatar image URL.
  optional string avatar_url = 9;
  // Email addresses.
  repeated ContactEmail emails = 10;
  // Phone numbers.
  repeated ContactPhone phones = 11;
  // Favorite/starred flag.
  bool is_favorite = 12;
  // Number of recorded interactions with this contact.
  uint64 interaction_count = 13;
}

// ContactsSyncRequest mirrors `SyncRequest`'s shape (unlike Calendar's
// collection-scoped sync) since `ContactsBackend::fetch_contacts` is
// account-scoped, not collection-scoped.
message ContactsSyncRequest {
  string account_id = 1;
}

// ContactsSyncResponse reports how many contacts were synchronized.
message ContactsSyncResponse {
  uint64 synced_count = 1;
}

// ListContactsRequest. Contacts are always scoped to the account whose
// address book they belong to, mirroring the store's `list_contacts`
// signature.
message ListContactsRequest {
  string account_id = 1;
}

// ListContactsResponse.
message ListContactsResponse {
  repeated Contact contacts = 1;
}

// GetContactRequest.
message GetContactRequest {
  string contact_id = 1;
}

// GetContactResponse.
message GetContactResponse {
  Contact contact = 1;
}

// CreateContactRequest carries the fields needed to author a brand-new local
// contact. `emails`/`phones` follow `Contact`'s shape so multiple addresses
// could be supplied, though the CLI's `contact add` command only ever sends
// a single primary email today.
message CreateContactRequest {
  string account_id = 1;
  string display_name = 2;
  optional string organization = 3;
  repeated ContactEmail emails = 4;
  repeated ContactPhone phones = 5;
}

// CreateContactResponse carries the persisted contact, including its
// daemon-assigned `id`.
message CreateContactResponse {
  Contact contact = 1;
}

// Audit exposes the daemon's real WORM (Write Once, Read Many) HMAC-chained
// tamper-evident audit ledger (`nuncio_core::worm_audit`, via
// `DatabaseEngine`'s `worm_audit_records` table) over authenticated gRPC.
// This is a read/verify-only surface -- there is deliberately no RPC to
// create or mutate records here, since the ledger is written internally by
// the daemon as a side effect of other operations (e.g.
// `Export.ExportMailbox`) and the underlying SQLite table itself rejects
// `UPDATE`/`DELETE` at the schema level.
//
// SECURITY: this service MUST be mounted behind the SAME
// `BearerAuthInterceptor` that guards every other service `nunciod`
// exposes -- see `nunciod::grpc::serve_on_listener`.
service Audit {
  // ListRecords returns a page of the real, persisted WORM audit ledger,
  // sequence ascending.
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  // VerifyChain re-verifies the ENTIRE persisted WORM audit ledger's
  // HMAC hash-chain integrity, using the ledger's real WORM HMAC key
  // (provisioned once from the OS keyring vault at daemon startup). Never
  // fabricates `valid: true`.
  rpc VerifyChain(VerifyChainRequest) returns (VerifyChainResponse);
}

// AuditRecord mirrors `nuncio_core::WormAuditRecord` field-for-field.
// `record_hmac` is this record's verification MAC (a derived signature
// output), NOT secret key material -- the WORM HMAC signing key itself is
// never exposed over this or any other RPC.
message AuditRecord {
  // Monotonically increasing sequence index.
  uint64 sequence = 1;
  // UTC timestamp in nanoseconds since Unix epoch.
  int64 timestamp_ns = 2;
  // Subsystem or actor that performed the audited action.
  string actor = 3;
  // Action identifier (e.g. "data.export").
  string action = 4;
  // SHA-256 hash of the audited payload.
  string data_hash = 5;
  // Previous record's HMAC signature ("GENESIS" for sequence 1).
  string previous_block_hash = 6;
  // HMAC-SHA256 signature sealing this record.
  string record_hmac = 7;
}

// ListRecordsRequest. `limit` caps the number of records returned
// (sequence ascending); a value of 0 means "use the server's default
// limit".
message ListRecordsRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}

// ListRecordsResponse.
message ListRecordsResponse {
  repeated AuditRecord records = 1;
}

// VerifyChainRequest currently carries no parameters.
message VerifyChainRequest {}

// VerifyChainResponse reports the REAL result of re-verifying the entire
// persisted WORM audit ledger's hash chain -- never a fabricated `valid`.
message VerifyChainResponse {
  // Whether every persisted record's HMAC AND inter-record chain linkage
  // verified.
  bool valid = 1;
  // Total number of records checked.
  uint64 record_count = 2;
  // Present only when `valid` is false: the sequence number of the first
  // record whose HMAC or chain linkage failed to verify.
  optional uint64 first_broken_seq = 3;
}
