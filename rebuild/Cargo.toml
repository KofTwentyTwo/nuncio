[workspace]
resolver = "2"
members = ["crates/nuncio-engine", "crates/nuncio-proto", "crates/nunciod", "crates/nuncio-cli", "crates/nuncio-test-support"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
# Protocol libraries contain wire-level trace logging; compile it out in every build.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
fs4 = "0.13"
rand = "0.8"
hex = "0.4"
subtle = "2.6"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
rustix = { version = "1.1.4", features = ["fs"] }
clap = { version = "4", features = ["derive"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"
http = "1"
httpdate = "1"
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
base64 = "0.22"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
mailparse = "0.16"
mail-parser = { version = "0.11.9", features = ["serde"] }
mail-builder = { version = "0.5.0", default-features = false }
email_address = { version = "0.2.9", default-features = false }
chrono-tz = "0.10"
rrule = "0.14"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
