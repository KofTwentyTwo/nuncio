[package]
name = "nuncio-api-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

# An independent consumer, deliberately outside the engine's Cargo workspace.
[workspace]
resolver = "2"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
serde_json = "1"
zeroize = "1"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dev-dependencies]
nuncio-test-support = { path = "../../crates/nuncio-test-support" }
