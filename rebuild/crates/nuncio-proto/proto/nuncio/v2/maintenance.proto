syntax = "proto3";
package nuncio.v2;
import "nuncio/v2/system.proto";
import "nuncio/v2/calendar.proto";

service Maintenance {
  rpc RepairProjection(RepairProjectionRequest) returns (RepairProjectionResponse);
  rpc CreateBackup(CreateBackupRequest) returns (stream BackupChunk);
  rpc InspectBackup(stream BackupUploadChunk) returns (BackupInspection);
  rpc RestoreBackup(stream BackupUploadChunk) returns (RestoreBackupResponse);
}

// Secrets belong only in the authenticated request body, never argv or metadata.
message RecoverySecret { string passphrase = 1; }
message CreateBackupRequest { RecoverySecret secret = 1; }
message BackupInspection {
  uint32 format_version = 1;
  uint32 schema_version = 2;
  int64 created_at_ms = 3;
  uint64 revision = 4;
  uint64 accounts = 5;
  uint64 drafts = 6;
  uint64 operations = 7;
  uint64 byte_length = 8;
  string sha256 = 9;
}
message BackupData { uint64 offset = 1; bytes data = 2; }
message BackupDigest { uint64 byte_length = 1; string sha256 = 2; }
// Exactly one info frame, ordered nonempty data frames (at most 262144 bytes),
// then one complete frame followed by EOF. Never accept a partial download.
message BackupChunk {
  oneof content {
    BackupInspection info = 1;
    BackupData data = 2;
    BackupDigest complete = 3;
  }
}
// Maximum file size: 1 TiB. sha256 is exactly 64 lowercase hexadecimal digits.
// new_profile is absent for inspection and required for restore; 1–64 ASCII
// letters/digits/hyphen/underscore, naming a new sibling of the active profile.
message BackupUploadHeader {
  RecoverySecret secret = 1;
  uint64 byte_length = 2;
  string sha256 = 3;
  optional string new_profile = 4;
}
// Exactly one header then ordered nonempty data frames, each at most 262144 bytes.
// EOF must match the declared length and SHA256 before inspection or restore.
message BackupUploadChunk {
  oneof content {
    BackupUploadHeader header = 1;
    BackupData data = 2;
  }
}
message RestoreBackupResponse {
  string profile_id = 1;
  string directory = 2;
  BackupInspection backup = 3;
  uint32 schema_version = 4;
  uint64 revision = 5;
  uint64 held_operations = 6;
}

// Restore error metadata: nuncio-recovery-code is cleanup_incomplete or
// activation_uncertain. Cleanup failures also carry nuncio-restored-profile-id
// (the new UUID only). Preserve activated targets/keys on activation uncertainty.

// A dry run reports the current local projection and retained durable records;
// it performs no provider request and does not reserve the reported revision.
enum ProjectionScope {
  PROJECTION_SCOPE_UNSPECIFIED = 0;
  PROJECTION_SCOPE_MAIL = 1;
  PROJECTION_SCOPE_CALENDAR = 2;
}
message RepairProjectionRequest {
  string account_id = 1;
  ProjectionScope scope = 2;
  bool dry_run = 3;
  // Calendar only; absent uses the engine's bounded rolling window.
  AgendaWindow window = 4;
}
message ProjectionCounts {
  uint64 messages = 1; uint64 collections = 2; uint64 attachments = 3;
  uint64 search_entries = 4; uint64 calendars = 5; uint64 events = 6;
  uint64 occurrences = 7;
}
message PreservedStateCounts {
  uint64 drafts = 1; uint64 draft_attachments = 2; uint64 operations = 3;
  uint64 attempts = 4; uint64 receipts = 5;
}
message RepairProjectionResponse {
  string account_id = 1; ProjectionScope scope = 2; bool dry_run = 3;
  uint64 revision = 4; ProjectionCounts projection = 5;
  PreservedStateCounts preserved = 6;
  // Absent for dry run. Inspect/cancel through System sync-run RPCs.
  SyncRun run = 7;
  AgendaWindow window = 8;
}
