dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3
!include /etc/dovecot/vendor.d/rootless.conf
protocols = imap
log_path = /dev/stdout
ssl = required
ssl_server {
  cert_file = /etc/dovecot/ssl/tls.crt
  key_file = /etc/dovecot/ssl/tls.key
}
auth_mechanisms = plain login
passdb passwd-file {
  passwd_file_path = /etc/dovecot/test-users
}
userdb static {
  fields {
    uid = 1000
    gid = 1000
    home = /srv/vmail/%{user | lower}
  }
}
mail_driver = maildir
mail_path = ~/mail
mail_home = /srv/vmail/%{user | lower}
mail_uid = 1000
mail_gid = 1000
imap4rev2_enable = no
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
}
service imap-login {
  chroot =
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
    ssl = yes
  }
}
