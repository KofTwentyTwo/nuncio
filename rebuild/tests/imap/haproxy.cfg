global
    maxconn 256

defaults
    mode tcp
    timeout connect 5s
    timeout client 120s
    timeout server 120s

listen imaps
    bind :31993
    server provider dovecot:31993

listen imap
    bind :31143
    server provider dovecot:31143

listen smtp
    bind :11025
    server provider mailpit:1025

listen capture
    bind :18025
    server provider mailpit:8025

listen smtps
    bind :11026
    server provider mailpit_tls:1025

listen capture_tls
    bind :18026
    server provider mailpit_tls:8025
